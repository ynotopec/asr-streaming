<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio2Audio Translator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
        .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 2rem; }
        .row { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; justify-content: center; }
        select, button {
            padding: 0.6rem 1rem;
            border-radius: 6px;
            border: 1px solid #333;
            background: #1e1e1e;
            color: #e0e0e0;
            font-size: 0.95rem;
            cursor: pointer;
        }
        button { background: #2d2d2d; font-weight: 600; }
        button:hover { background: #3a3a3a; }
        button.active { background: #e53e3e; color: #fff; }
        .outputs { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; width: 100%; max-width: 800px; margin-top: 1.5rem; }
        .box {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 1rem;
            min-height: 120px;
        }
        .box h3 { font-size: 0.8rem; color: #888; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .box p { font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
        .box .empty { color: #444; font-style: italic; }
        audio { width: 100%; margin-top: 0.5rem; }
        #status { margin-top: 1rem; font-size: 0.85rem; color: #888; text-align: center; }
        @media (max-width: 600px) { .outputs { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <h1>🎙️ Audio2Audio Translator</h1>
    <p class="subtitle">Nemotron 3.5 ASR → MarianMT → Qwen3-TTS</p>

    <div class="row">
        <select id="srcLang">
            <option value="auto">Auto</option>
            <option value="en-US">English</option>
            <option value="fr-FR" selected>Français</option>
            <option value="de-DE">Deutsch</option>
            <option value="es-ES">Español</option>
            <option value="zh-CN">中文</option>
            <option value="ja-JP">日本語</option>
        </select>
        <span>→</span>
        <select id="tgtLang">
            <option value="en-US" selected>English</option>
            <option value="fr-FR">Français</option>
            <option value="de-DE">Deutsch</option>
            <option value="es-ES">Español</option>
            <option value="zh-CN">中文</option>
            <option value="ja-JP">日本語</option>
        </select>
        <select id="latency">
            <option value="560" selected>560ms</option>
            <option value="80">80ms</option>
            <option value="320">320ms</option>
            <option value="1120">1.1s</option>
        </select>
        <label style="margin-left:8px"><input type="checkbox" id="antiEcho" checked> anti-écho (haut-parleurs)</label>
        <button id="btnMic">🎤</button>
    </div>

    <div class="outputs">
        <div class="box">
            <h3>Source</h3>
            <p id="srcText" class="empty">Waiting…</p>
        </div>
        <div class="box">
            <h3>Translation</h3>
            <p id="tgtText" class="empty">Waiting…</p>
            <audio id="audioPlayer" controls></audio>
        </div>
    </div>

    <div id="status">Ready</div>

    <script>
        let ws = null;
        let audioCtx = null;
        let mediaStream = null;
        let workletNode = null;
        let rawAccum = [];
        let isRecording = false;
        let flushTimer = null;
        // Mic-mute windows (performance.now() ms). Each mic chunk is timestamped at
        // capture, so only chunks overlapping TTS playback are dropped — user speech
        // before/after is kept. A window opens when the TTS arrives (before decode)
        // and closes after playback end + output latency + echo tail.
        let muteWindows = [];
        const ECHO_TAIL_MS = 400;

        function isMuted(t) {
            return muteWindows.some(w => t >= w.from && t <= w.to);
        }

        // Auto-play TTS via Web Audio API (unlocked by the mic click gesture —
        // no manual play button needed) + mute mic during playback.
        async function playTts(data) {
            const arrival = performance.now();
            const win = { from: arrival, to: Infinity }; // open until duration known
            muteWindows.push(win);
            try {
                const arrayBuffer = data instanceof Blob ? await data.arrayBuffer() : data;
                const buf = await audioCtx.decodeAudioData(arrayBuffer);
                const src = audioCtx.createBufferSource();
                src.buffer = buf;
                src.connect(audioCtx.destination);
                src.start();
                const outLatencyMs = ((audioCtx.outputLatency || 0) + (audioCtx.baseLatency || 0)) * 1000;
                win.to = performance.now() + outLatencyMs + buf.duration * 1000 + ECHO_TAIL_MS;
                const audioEl = document.getElementById('audioPlayer');
                audioEl.src = URL.createObjectURL(new Blob([arrayBuffer], { type: 'audio/wav' }));
            } catch (e) {
                win.to = arrival + 500; // never leave the mic muted forever on a decode error
                console.error('TTS playback error', e);
            }
            muteWindows = muteWindows.filter(w => w.to > performance.now() - 2000);
        }

        const btnMic = document.getElementById('btnMic');
        const srcLang = document.getElementById('srcLang');
        const tgtLang = document.getElementById('tgtLang');
        const latencySel = document.getElementById('latency');
        const srcTextEl = document.getElementById('srcText');
        const tgtTextEl = document.getElementById('tgtText');
        const audioEl = document.getElementById('audioPlayer');
        const statusEl = document.getElementById('status');

        function setStatus(s) { statusEl.textContent = s; }

        async function startCapture() {
            try {
                audioCtx = new AudioContext({ sampleRate: 16000 }); // must match server SAMPLE_RATE (browser resamples)
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    // Raw speech for ASR: no noise suppression / AGC (they alter phonemes).
                    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: false, autoGainControl: false }
                });
                const code = `
                    class Capturer extends AudioWorkletProcessor {
                        process(inputs) {
                            if (inputs[0]?.[0]?.length) this.port.postMessage(inputs[0][0].slice());
                            return true;
                        }
                    }
                    registerProcessor('capturer', Capturer);
                `;
                const blob = new Blob([code], { type: 'application/javascript' });
                await audioCtx.audioWorklet.addModule(URL.createObjectURL(blob));
                URL.revokeObjectURL(blob);

                workletNode = new AudioWorkletNode(audioCtx, 'capturer');
                workletNode.port.onmessage = (e) => rawAccum.push({ t: performance.now(), d: e.data });
                audioCtx.createMediaStreamSource(mediaStream).connect(workletNode);

                const gain = audioCtx.createGain();
                gain.gain.value = 0;
                workletNode.connect(gain);
                gain.connect(audioCtx.destination);

                return true;
            } catch (err) {
                console.error(err);
                setStatus('Mic error: ' + err.message);
                return false;
            }
        }

        function stopCapture() {
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
            if (workletNode) { workletNode.disconnect(); workletNode = null; }
            if (audioCtx) { audioCtx.close(); audioCtx = null; }
            rawAccum = [];
        }

        function connectWS() {
            return new Promise((resolve, reject) => {
                const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${proto}//${location.host}/ws/translate`);
                ws.onopen = () => {
                    ws.send(JSON.stringify({
                        src_lang: srcLang.value,
                        tgt_lang: tgtLang.value,
                        latency_ms: parseInt(latencySel.value),
                        sample_rate: (audioCtx && audioCtx.sampleRate) || 16000
                    }));
                    resolve();
                };
                ws.onmessage = (ev) => {
                    if (ev.data instanceof Blob || ev.data instanceof ArrayBuffer) {
                        playTts(ev.data);
                        return;
                    }
                    try {
                        const d = JSON.parse(ev.data);
                        if (d.type === 'transcript') {
                            srcTextEl.classList.remove('empty');
                            srcTextEl.textContent = d.text;
                        } else if (d.type === 'translated') {
                            tgtTextEl.classList.remove('empty');
                            tgtTextEl.textContent = d.text;
                        }
                    } catch (e) {}
                };
                ws.onerror = () => setStatus('WS error');
                ws.onclose = () => { if (isRecording) setStatus('Disconnected'); };
                ws._reject = reject;
            });
        }

        function flushAudio() {
            if (!ws || ws.readyState !== WebSocket.OPEN || rawAccum.length === 0) return;
            // While TTS plays: drop only the mic chunks captured inside a mute window
            // (speaker→mic feedback loop); keep genuine speech around it.
            let chunks = rawAccum;
            rawAccum = [];
            if (document.getElementById('antiEcho').checked) {
                chunks = chunks.filter(c => !isMuted(c.t));
            }
            if (chunks.length === 0) return;
            let total = 0;
            for (const c of chunks) total += c.d.length;
            const merged = new Float32Array(total);
            let off = 0;
            for (const c of chunks) { merged.set(c.d, off); off += c.d.length; }
            const int16 = new Int16Array(merged.length);
            for (let i = 0; i < merged.length; i++) {
                int16[i] = merged[i] * (merged[i] < 0 ? 0x8000 : 0x7FFF);
            }
            ws.send(int16.buffer);
        }

        btnMic.addEventListener('click', async () => {
            if (isRecording) {
                isRecording = false;
                btnMic.classList.remove('active');
                btnMic.textContent = '🎤';
                clearInterval(flushTimer);
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ command: 'stop' }));
                    setTimeout(() => ws.close(), 1500);
                }
                stopCapture();
                setStatus('Stopped');
            } else {
                const ok = await startCapture();
                if (!ok) return;
                try {
                    await connectWS();
                } catch (e) {
                    setStatus('Cannot connect');
                    stopCapture();
                    return;
                }
                isRecording = true;
                btnMic.classList.add('active');
                btnMic.textContent = '⏹️';
                setStatus('Translating…');
                flushTimer = setInterval(flushAudio, 250);
            }
        });
    </script>
</body>
</html>
